name: Build & Package macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package (.app)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Display Environment Info
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build and Bundle App
        run: |
          bash Scripts/bundle.sh

      - name: Compress App Bundle
        run: |
          # 使用 macOS 原生 ditto 工具打包，完整保留 bundle 签名与元数据
          ditto -c -k --sequesterRsrc --keepParent AutoCheckin.app AutoCheckin-macOS.zip
          shasum -a 256 AutoCheckin-macOS.zip > AutoCheckin-macOS.zip.sha256
          echo "SHA256 Checksum:"
          cat AutoCheckin-macOS.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheckin-macOS
          path: |
            AutoCheckin-macOS.zip
            AutoCheckin-macOS.zip.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoCheckin-macOS.zip
            AutoCheckin-macOS.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
