name: Build & Package macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package (.app)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Display Environment Info
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build and Bundle App
        run: |
          bash Scripts/bundle.sh

      - name: Package App Bundles (DMG & ZIP)
        run: |
          # 计算 bundle.sh 生成的 DMG 的 SHA256 校验码
          shasum -a 256 AutoCheckin-macOS.dmg > AutoCheckin-macOS.dmg.sha256
          
          # 同时生成 ZIP 压缩备份包
          ditto -c -k --sequesterRsrc --keepParent AutoCheckin.app AutoCheckin-macOS.zip
          shasum -a 256 AutoCheckin-macOS.zip > AutoCheckin-macOS.zip.sha256
          
          echo "=== Checksums ==="
          cat AutoCheckin-macOS.dmg.sha256
          cat AutoCheckin-macOS.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheckin-macOS
          path: |
            AutoCheckin-macOS.dmg
            AutoCheckin-macOS.dmg.sha256
            AutoCheckin-macOS.zip
            AutoCheckin-macOS.zip.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoCheckin-macOS.dmg
            AutoCheckin-macOS.dmg.sha256
            AutoCheckin-macOS.zip
            AutoCheckin-macOS.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
